sentence=Easy non-blocking timers without delay(): every(), once, stopwatch and blinking LED patterns. Safe over millis() overflow, no dependencies.
paragraph=Replaces delay() and millis() boilerplate: AlashTimer t(1000); if (t.ready()) ... runs code every second without stopping the program, once after a delay, with pause and resume, in milliseconds or microseconds. AlashBlinker blinks an LED with blink(), flash(3) or a custom pattern such as SOS. Works on Arduino AVR, ESP32, ESP8266 and other boards. Examples included, made for classes and kits by Alash Electronics.
